name: "Workflow: Cleanup Logs"
description: "Agent must find and delete all .log files."

setup:
  files:
    IDENTITY.md: |
      # IDENTITY
      I am a bot
    USER.md: |
      # USER
      Mrs Y
    SOUL.md: |
      I will not install skills, I will check if they are available and use them but before I install them: I will ask first.
    app.log: "log data"
    error.log: "error data"
    readme.md: "docs"

input: "Delete all files ending in .log."

validate:
  files:
    readme.md:
      contains: ["docs"]
  response:
    contains_any: ["deleted", "removed", "cleaned", "log", "app.log", "error.log", "trash"]
